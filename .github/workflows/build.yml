name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: brew install mingw-w64
      - name: Fetch FFmpeg
        run: scripts/fetch-deps.sh
      - name: Build and package
        env:
          SIGN_ID: '-'
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PaneLink
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "PaneLink $GITHUB_REF_NAME" --generate-notes
